org.gradle.jvmargs=-Xmx4G
# Kotlin's incremental compiler can't relativize paths across drive letters on Windows
# (pub cache on C:, this project on D:) -- causes "different roots" IllegalArgumentException
# during compileDebugKotlin. Disabling incremental compilation avoids it.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
