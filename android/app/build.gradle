plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '2.0'
}

 def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    //namespace "com.example.sq_notification"
    namespace "com.smartqsys.sq_notification"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.smartqsys.sq_notification"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // 2026-09-11: was pinned to a literal 23 (firebase_messaging 16.5.0's own floor) on the
        // assumption Flutter's own default (flutter.minSdkVersion) was lower -- it no longer is.
        // This Flutter SDK (3.44.x) hardcodes a floor of 24 and its build tooling silently
        // rewrites any literal <=23 back to flutter.minSdkVersion on every single `flutter
        // build`, before Gradle even runs -- confirmed via the actual compiled manifest
        // (build/app/intermediates/.../AndroidManifest.xml) that both of today's release builds
        // already shipped with minSdkVersion=24 regardless of what this file said, and almost
        // certainly every build since this Flutter SDK was adopted did too. Pinning a literal
        // <=23 here was silently ineffective this whole time -- 24 has been the real shipped
        // floor already; using the variable here (rather than a literal 24) keeps it tracking
        // Flutter's own floor instead of drifting stale again the next time that floor moves.
        minSdkVersion flutter.minSdkVersion
        versionCode  71
        versionName "48.0.23"
        targetSdkVersion 36
//        versionCode flutterVersionCode.toInteger()
//        versionName flutterVersionName
    }
/*
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    } */
    signingConfigs {
         release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
   }
   buildTypes {
       release {
           signingConfig signingConfigs.release
       }
   }

}

flutter {
    source '../..'
}

dependencies {
  //implementation 'com.google.android.material:material:<version>'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
